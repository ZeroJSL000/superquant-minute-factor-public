[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minute-factor-public"
version = "0.1.0"
description = "A synthetic-data reconstruction of a minute-level factor research workflow"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
rl = ["torch>=2.0"]

[tool.setuptools.packages.find]
include = ["minute_factor_public*"]
